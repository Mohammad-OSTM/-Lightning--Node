<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightning & Bitcoin Dashboard</title>
  
  <!-- کتابخانه‌های Three.js و Globe.gl برای رندر کره زمین -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* --- ۱. منوی ۴ تایی بالا سمت راست --- */
    .top-right-bar {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      direction: ltr;
      z-index: 9999;
      background: rgba(18, 22, 31, 0.7);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-lightning {
      width: 38px;
      height: 38px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-lightning svg { width: 20px; height: 20px; fill: #0b0e14; }

    .btn-mempool {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-mempool svg { width: 20px; height: 20px; fill: #ffffff; }

    .btn-1ml {
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-amboss {
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .top-right-bar a:hover { opacity: 0.85; transform: translateY(-1px); }

    /* --- ۲. نوار جستجو در بالا سمت چپ --- */
    .search-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      width: 320px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(18, 22, 31, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    /* --- ۳. ستون‌ها و کارت‌های اطلاعاتی در پایین --- */
    .dashboard-columns {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      z-index: 9999;
      pointer-events: none; /* جهت عبور کلیک‌ها به کره زمین در فضا‌های خالی */
    }

    .card {
      pointer-events: auto;
      background: rgba(18, 22, 31, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
    }

    .card-title {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }

    /* کانتینر کره زمین */
    #globeViz {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- ۱. نوار جستجو (Search) -->
  <div class="search-container">
    <input type="text" class="search-input" placeholder="جستجوی نود، آدرس یا تراکنش...">
  </div>

  <!-- ۲. ۴ دکمه بالا سمت راست -->
  <div class="top-right-bar">
    <a href="https://lightning.engineering" target="_blank" class="btn-lightning" title="Lightning Engineering">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </a>

    <a href="https://mempool.space" target="_blank" class="btn-mempool" title="Mempool.space">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H7v-4h4v4zm0-6H7V7h4v4zm6 6h-4v-4h4v4zm0-6h-4V7h4v4z"/></svg>
    </a>

    <a href="https://1ml.com" target="_blank" class="btn-1ml" title="1ML">1ML</a>

    <a href="https://amboss.space" target="_blank" class="btn-amboss" title="Amboss Space">Amboss</a>
  </div>

  <!-- ۳. ستون‌ها و آمار داشبورد -->
  <div class="dashboard-columns">
    <div class="card">
      <div class="card-title">تعداد نودهای فعال</div>
      <div class="card-value">14,250</div>
    </div>
    <div class="card">
      <div class="card-title">ظرفیت شبکه (BTC)</div>
      <div class="card-value">5,410 BTC</div>
    </div>
    <div class="card">
      <div class="card-title">تعداد کانال‌ها</div>
      <div class="card-value">62,180</div>
    </div>
    <div class="card">
      <div class="card-title">کارمزد متوسط</div>
      <div class="card-value">1 Sat/vB</div>
    </div>
  </div>

  <!-- ۴. پس‌زمینه کره زمین سه‌بعدی -->
  <div id="globeViz"></div>

  <script>
    // راه‌اندازی کره زمین سه‌بعدی
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#3a86ff')
      .atmosphereAltitude(0.25);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;
  </script>

</body>
</html>
