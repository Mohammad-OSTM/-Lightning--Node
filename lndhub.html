<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDHUB - Lightning Node Manager</title>
    <!-- Three.js for 3D Globe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 3D Canvas Background */
        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Content Overlay */
        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            pointer-events: none; /* Allows interaction with 3D scene below if needed */
        }

        .interactive-element {
            pointer-events: auto;
        }

        /* Header Navigation */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 25px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .lightning-icon {
            color: #3b82f6;
            font-size: 24px;
            filter: drop-shadow(0 0 10px #2563eb);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .nav-link-badge {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
        }

        .nav-link-text {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
        }

        /* Hero Title */
        .hero-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 35px rgba(37, 99, 235, 0.7);
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats Cards */
        .stats-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(59, 130, 246, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 20px 16px;
            text-align: center;
            flex: 1;
            min-width: 160px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(59, 130, 246, 0.15);
        }

        .stat-card.large {
            flex: 1.4;
        }

        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .stat-card.large .stat-value {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* Search Input */
        .search-container {
            width: 100%;
            max-width: 580px;
            position: relative;
            margin-bottom: 60px;
        }

        .search-input {
            width: 100%;
            padding: 16px 28px;
            padding-right: 65px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border: none;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        /* Footer Bottom Bar */
        .footer {
            margin-top: auto;
            padding: 20px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
            width: 100%;
            background: rgba(3, 7, 18, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <div id="globe-container"></div>

    <!-- UI Layer -->
    <div class="content-layer">
        <!-- Header -->
        <div class="header interactive-element">
            <div class="brand-logo">
                <span class="lightning-icon">⚡</span>
                <span>LND WORLD</span>
            </div>

            <div class="nav-icons">
                <div class="nav-btn">⚡</div>
                <div class="nav-btn">🌐</div>
                <a href="#" class="nav-link-badge">1ML</a>
                <a href="#" class="nav-link-text">Amboss</a>
            </div>
        </div>

        <!-- Title -->
        <h1 class="hero-title">LND WORLD</h1>

        <!-- Stats Cards -->
        <div class="stats-container interactive-element">
            <div class="stat-card">
                <div class="stat-label">Total Nodes</div>
                <div class="stat-value">6,013</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Active Channels</div>
                <div class="stat-value">19,920</div>
            </div>

            <div class="stat-card large">
                <div class="stat-label">Network Capacity</div>
                <div class="stat-value">2,630.34 BTC</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">New Nodes</div>
                <div class="stat-value">11</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">New Channels</div>
                <div class="stat-value">274</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container interactive-element">
            <input type="text" class="search-input" placeholder="Search Node ...">
            <button class="search-btn">🔍</button>
        </div>

        <!-- Footer Copyright -->
        <footer class="footer interactive-element">
            &copy; 2026 LNDHUB. All Rights Reserved.
        </footer>
    </div>

    <!-- 3D Globe & Effects Engine -->
    <script>
        const container = document.getElementById('globe-container');

        // Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 210;
        camera.position.y = -10;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 1. Dot-Matrix Globe Generation
        const radius = 65;
        const dotsCount = 4500;
        const dotPositions = new Float32Array(dotsCount * 3);

        for (let i = 0; i < dotsCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / dotsCount);
            const theta = Math.sqrt(dotsCount * Math.PI) * phi;

            dotPositions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
            dotPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
            dotPositions[i * 3 + 2] = radius * Math.cos(phi);
        }

        const dotsGeometry = new THREE.BufferGeometry();
        dotsGeometry.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));

        const dotsMaterial = new THREE.PointsMaterial({
            color: 0x60a5fa,
            size: 1.3,
            transparent: true,
            opacity: 0.9
        });

        const globe = new THREE.Points(dotsGeometry, dotsMaterial);
        scene.add(globe);

        // 2. Neon Outer Atmosphere Glow Effect
        const glowGeometry = new THREE.SphereGeometry(radius + 2, 64, 64);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0x1d4ed8,
            transparent: true,
            opacity: 0.25,
            side: THREE.BackSide
        });
        const glowSphere = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(glowSphere);

        // Outer Aura Ring
        const ringGeo = new THREE.RingGeometry(radius + 8, radius + 22, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x3b82f6,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.2
        });
        const auraRing = new THREE.Mesh(ringGeo, ringMat);
        auraRing.rotation.x = Math.PI / 2.2;
        scene.add(auraRing);

        // 3. Shooting Star / Comet Animation
        const cometGeometry = new THREE.BufferGeometry();
        const cometPos = new Float32Array(20 * 3); // Tail points
        cometGeometry.setAttribute('position', new THREE.BufferAttribute(cometPos, 3));

        const cometMaterial = new THREE.PointsMaterial({
            color: 0x93c5fd,
            size: 2.2,
            transparent: true,
            opacity: 0.9
        });
        const comet = new THREE.Points(cometGeometry, cometMaterial);
        scene.add(comet);

        let cometProgress = 0;

        function updateComet() {
            cometProgress += 0.015;
            if (cometProgress > 1) cometProgress = 0;

            const startX = -120, startY = 80, startZ = -30;
            const endX = 120, endY = -80, endZ = 30;

            const currentX = startX + (endX - startX) * cometProgress;
            const currentY = startY + (endY - startY) * cometProgress;
            const currentZ = startZ + (endZ - startZ) * cometProgress;

            const positions = comet.geometry.attributes.position.array;
            positions[0] = currentX;
            positions[1] = currentY;
            positions[2] = currentZ;

            comet.geometry.attributes.position.needsUpdate = true;
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Globe Rotation
            globe.rotation.y += 0.0025;
            glowSphere.rotation.y += 0.0025;
            auraRing.rotation.z += 0.001;

            updateComet();

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
