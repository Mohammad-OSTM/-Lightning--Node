<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightning & Bitcoin Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #12161f; /* رنگ پس‌زمینه اصلی صفحه */
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    /* --- استایل منوی ۴ تایی بالا سمت راست --- */
    .top-right-bar {
      position: fixed;
      top: 15px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      direction: ltr; /* چیدمان از چپ به راست */
      z-index: 9999;
    }

    /* ۱. دکمه دایره‌ای Lightning */
    .btn-lightning {
      width: 38px;
      height: 38px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-lightning svg {
      width: 20px;
      height: 20px;
      fill: #12161f;
    }

    /* ۲. دکمه مربعی Mempool (گرادینت آبی) */
    .btn-mempool {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-mempool svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    /* ۳. دکمه 1ML */
    .btn-1ml {
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: transform 0.2s, opacity 0.2s;
    }

    /* ۴. دکمه متنی Amboss */
    .btn-amboss {
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    /* افکت هوور برای ۴ دکمه */
    .top-right-bar a:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    /* --- بخش محتوای اصلی صفحه (کدهای قبلی خود را اینجا اضافه کنید) --- */
    .main-content {
      margin-top: 60px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- دکمه‌های بالا سمت راست -->
  <div class="top-right-bar">
    <!-- ۱. Lightning Engineering -->
    <a href="https://lightning.engineering" target="_blank" class="btn-lightning" title="Lightning Engineering">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </a>

    <!-- ۲. Mempool.space -->
    <a href="https://mempool.space" target="_blank" class="btn-mempool" title="Mempool.space">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H7v-4h4v4zm0-6H7V7h4v4zm6 6h-4v-4h4v4zm0-6h-4V7h4v4z"/></svg>
    </a>

    <!-- ۳. 1ML -->
    <a href="https://1ml.com" target="_blank" class="btn-1ml" title="1ML">1ML</a>

    <!-- ۴. Amboss.space -->
    <a href="https://amboss.space" target="_blank" class="btn-amboss" title="Amboss Space">Amboss</a>
  </div>

  <!-- محتوای اصلی سایت شما -->
  <div class="main-content">
    <!-- کدهای بدنه و جدول‌ها یا اطلاعات قبلی سایت خود را دقیقاً در این قسمت قرار دهید -->
  </div>

</body>
</html>
