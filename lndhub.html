<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDHUB - Lightning Node Manager</title>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #020617;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 3D Canvas Background */
        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #globe-container:active {
            cursor: grabbing;
        }

        /* UI Layer */
        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 20px 0 20px;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }

        /* Header Navigation */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .lightning-icon {
            color: #3b82f6;
            font-size: 22px;
            filter: drop-shadow(0 0 10px #2563eb);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            background-color: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .nav-link-badge {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
        }

        .nav-link-text {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
        }

        /* Stats Cards Top Layout */
        .stats-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1050px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .stat-card.large {
            flex: 1.3;
        }

        .stat-label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-card.large .stat-value {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* Search Bar */
        .search-container {
            width: 100%;
            max-width: 520px;
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 24px;
            padding-right: 55px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border: none;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding: 14px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            width: 100%;
            background: rgba(2, 6, 23, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <!-- 3D Globe Canvas -->
    <div id="globe-container"></div>

    <!-- UI Overlay Layer -->
    <div class="content-layer">
        <!-- Header -->
        <div class="header interactive-element">
            <div class="brand-logo">
                <span class="lightning-icon">⚡</span>
                <span>LNDHUB</span>
            </div>

            <div class="nav-icons">
                <div class="nav-btn">⚡</div>
                <div class="nav-btn">🌐</div>
                <a href="#" class="nav-link-badge">1ML</a>
                <a href="#" class="nav-link-text">Amboss</a>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-container interactive-element">
            <div class="stat-card">
                <div class="stat-label">Total Nodes</div>
                <div class="stat-value">6,013</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Active Channels</div>
                <div class="stat-value">19,920</div>
            </div>

            <div class="stat-card large">
                <div class="stat-label">Network Capacity</div>
                <div class="stat-value">2,630.34 BTC</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">New Nodes</div>
                <div class="stat-value">11</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">New Channels</div>
                <div class="stat-value">274</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container interactive-element">
            <input type="text" class="search-input" placeholder="Search Node ...">
            <button class="search-btn">🔍</button>
        </div>

        <!-- Footer Copyright -->
        <footer class="footer interactive-element">
            &copy; 2026 LNDHUB. All Rights Reserved.
        </footer>
    </div>

    <!-- 3D World Globe Script -->
    <script>
        const container = document.getElementById('globe-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -28, 180);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // OrbitControls for Drag/Rotate Globe
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.rotateSpeed = 0.8;

        const radius = 65;
        const globeGroup = new THREE.Group();
        globeGroup.position.y = -30;
        scene.add(globeGroup);

        // Map Image to Generate Dot-Matrix Continents
        const image = new Image();
        image.crossOrigin = "Anonymous";
        image.src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1000&q=80"; // Canvas map data source
        
        // Generate Continents Dot Matrix Pattern
        const mapCanvas = document.createElement('canvas');
        const mapContext = mapCanvas.getContext('2d');
        mapCanvas.width = 200;
        mapCanvas.height = 100;

        // Populate World Points
        const dotsGeometry = new THREE.BufferGeometry();
        const positions = [];
        const dotsCount = 9000;

        for (let i = 0; i < dotsCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / dotsCount);
            const theta = Math.sqrt(dotsCount * Math.PI) * phi;

            const x = radius * Math.cos(theta) * Math.sin(phi);
            const y = radius * Math.sin(theta) * Math.sin(phi);
            const z = radius * Math.cos(phi);

            positions.push(x, y, z);
        }

        dotsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const dotsMaterial = new THREE.PointsMaterial({
            color: 0x93c5fd,
            size: 1.2,
            transparent: true,
            opacity: 0.85
        });

        const globeDots = new THREE.Points(dotsGeometry, dotsMaterial);
        globeGroup.add(globeDots);

        // Glowing Blue Atmosphere Ring (Outer Halo)
        const glowGeo = new THREE.RingGeometry(radius, radius + 18, 64);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x2563eb,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const glowRing = new THREE.Mesh(glowGeo, glowMat);
        globeGroup.add(glowRing);

        // Shooting Star Animation
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.8 });
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
        const shootingStar = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(shootingStar);

        const starHeadGeo = new THREE.BufferGeometry();
        starHeadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3));
        const starHeadMat = new THREE.PointsMaterial({ color: 0xffffff, size: 5, transparent: true });
        const starHead = new THREE.Points(starHeadGeo, starHeadMat);
        scene.add(starHead);

        let progress = 0;
        function updateShootingStar() {
            progress += 0.012;
            if (progress > 1) progress = 0;

            const startX = -60, startY = 50, startZ = 10;
            const endX = 15, endY = -15, endZ = 50;

            const curX = startX + (endX - startX) * progress;
            const curY = startY + (endY - startY) * progress;
            const curZ = startZ + (endZ - startZ) * progress;

            const linePos = shootingStar.geometry.attributes.position.array;
            linePos[0] = curX - 15; linePos[1] = curY + 15; linePos[2] = curZ - 5;
            linePos[3] = curX;       linePos[4] = curY;       linePos[5] = curZ;
            shootingStar.geometry.attributes.position.needsUpdate = true;

            const headPos = starHead.geometry.attributes.position.array;
            headPos[0] = curX; headPos[1] = curY; headPos[2] = curZ;
            starHead.geometry.attributes.position.needsUpdate = true;
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            globeGroup.rotation.y += 0.0018;
            updateShootingStar();
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
