<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LNDHUB - Lightning Node Manager</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1322;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* --- ۴ دکمه بالا سمت راست --- */
    .top-right-bar {
      position: fixed;
      top: 15px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      direction: ltr;
      z-index: 9999;
    }

    .btn-lightning {
      width: 36px;
      height: 36px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn-lightning svg { width: 18px; height: 18px; fill: #0d1322; }

    .btn-mempool {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn-mempool svg { width: 18px; height: 18px; fill: #ffffff; }

    .btn-1ml {
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      text-decoration: none;
    }

    .btn-amboss {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
    }

    /* --- آمار بالای صفحه --- */
    .top-stats {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 1100px;
      margin-top: 40px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: rgba(30, 41, 69, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 25px;
      text-align: center;
      flex: 1;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #38bdf8;
    }

    /* --- باکس سرچ --- */
    .search-wrapper {
      width: 100%;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #2b3b64;
      border-radius: 30px;
      padding: 5px 8px 5px 20px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      text-align: center;
    }

    .search-btn {
      background: #38bdf8;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* --- گرید کارت‌های اطلاعاتی --- */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 1100px;
    }

    .info-card {
      background: rgba(30, 41, 69, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .info-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- ۴ دکمه بالا سمت راست -->
  <div class="top-right-bar">
    <a href="https://lightning.engineering" target="_blank" class="btn-lightning" title="Lightning Engineering">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </a>
    <a href="https://mempool.space" target="_blank" class="btn-mempool" title="Mempool.space">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H7v-4h4v4zm0-6H7V7h4v4zm6 6h-4v-4h4v4zm0-6h-4V7h4v4z"/></svg>
    </a>
    <a href="https://1ml.com" target="_blank" class="btn-1ml" title="1ML">1ML</a>
    <a href="https://amboss.space" target="_blank" class="btn-amboss" title="Amboss Space">Amboss</a>
  </div>

  <!-- آمار بالایی -->
  <div class="top-stats">
    <div class="stat-card"><div class="stat-value" id="stat1">-</div></div>
    <div class="stat-card"><div class="stat-value" id="stat2">-</div></div>
    <div class="stat-card"><div class="stat-value" id="stat3">-</div></div>
    <div class="stat-card"><div class="stat-value" id="stat4">-</div></div>
    <div class="stat-card"><div class="stat-value" id="stat5">-</div></div>
  </div>

  <!-- نوار سرچ (ابتدا خالی) -->
  <div class="search-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Enter ID..." onkeypress="handleKeyPress(event)">
      <button class="search-btn" onclick="executeSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>

  <!-- شبکه کارت‌های اطلاعات متغیر -->
  <div class="info-grid">
    <div class="info-card">
      <div class="info-title">ON/OFF</div>
      <div class="info-value" id="val-onoff">-</div>
    </div>
    <div class="info-card">
      <div class="info-title">WALLET ADDRESS</div>
      <div class="info-value" id="val-wallet">-</div>
    </div>
    <div class="info-card">
      <div class="info-title">STATUS TX</div>
      <div class="info-value" id="val-status">-</div>
    </div>

    <div class="info-card">
      <div class="info-title">COIN</div>
      <div class="info-value" id="val-coin">-</div>
    </div>
    <div class="info-card">
      <div class="info-title">FEE</div>
      <div class="info-value" id="val-fee">-</div>
    </div>
    <div class="info-card">
      <div class="info-title">ACTIVE CHANNEL</div>
      <div class="info-value" id="val-active-channel">-</div>
    </div>

    <div class="info-card">
      <div class="info-title">IP ADDRESS</div>
      <div class="info-value" id="val-ip">-</div>
    </div>
    <div class="info-card">
      <div class="info-title">MODE</div>
      <div class="info-value" id="val-mode">-</div>
    </div>
    <div class="info-card">
      <div class="info-title">CHANNEL TYPE</div>
      <div class="info-value" id="val-channel-type">-</div>
    </div>
  </div>

  <script>
    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    }

    function executeSearch() {
      const inputVal = document.getElementById('searchInput').value.trim();
      if (!inputVal) return;

      // نمایش آمار بالای صفحه
      document.getElementById('stat1').innerText = "012";
      document.getElementById('stat2').innerText = "19,927";
      document.getElementById('stat3').innerText = "2,632.4 BTC";
      document.getElementById('stat4').innerText = "12";
      document.getElementById('stat5').innerText = "28";

      // پر کردن کارت‌های متغیر بر اساس جستجو
      document.getElementById('val-onoff').innerText = "Online";
      document.getElementById('val-wallet').innerText = "GyUkZPmeTClYPgTJHL1AEiHsfee9934zpA3wfL2fkbYQ";
      document.getElementById('val-status').innerText = "Pending ⓘ";
      document.getElementById('val-coin').innerText = "SOL";
      document.getElementById('val-fee').innerText = "15 SAT/VB";
      document.getElementById('val-active-channel').innerText = "Must Be Update Client";
      document.getElementById('val-ip').innerText = "🇹🇯 5.117.240.152";
      document.getElementById('val-mode').innerText = "CPU";
      
      // محدودیتی که خواسته بودید: کانال بیشتر از ۶ تا نباشد
      document.getElementById('val-channel-type').innerText = "6 Channel";
    }
  </script>

</body>
</html>
