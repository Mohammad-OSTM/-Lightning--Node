<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LNDHUB - Lightning Node Manager</title>
  
  <!-- کتابخانه‌های مورد نیاز برای رندر کره زمین ۳ بعدی -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* --- پس‌زمینه کره زمین ۳ بعدی --- */
    #globeViz {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: all;
    }

    /* کانتینر اصلی محتوا جهت قرارگیری روی کره زمین */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none; /* اجازه چرخاندن کره زمین در فضاهای خالی */
    }

    .interactive-element {
      pointer-events: auto; /* فعال کردن کلیک روی دکمه‌ها و ورودی‌ها */
    }

    /* --- ۴ دکمه بالا سمت راست --- */
    .top-right-bar {
      position: fixed;
      top: 15px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      direction: ltr;
      z-index: 9999;
      background: rgba(18, 22, 31, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: auto;
    }

    .btn-lightning {
      width: 36px;
      height: 36px;
      background-color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn-lightning svg { width: 18px; height: 18px; fill: #0b0e14; }

    .btn-mempool {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #1e3a8a, #0284c7, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .btn-mempool svg { width: 18px; height: 18px; fill: #ffffff; }

    .btn-1ml {
      background-color: #0070f3;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 4px;
      text-decoration: none;
    }

    .btn-amboss {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
    }

    /* --- آمار بالای صفحه --- */
    .top-stats {
      display: flex;
      justify-content: center;
      gap: 15px;
      width: 100%;
      margin-top: 30px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: rgba(18, 22, 31, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      text-align: center;
      flex: 1;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
    }

    /* --- نوار سرچ --- */
    .search-wrapper {
      width: 100%;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(43, 59, 100, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 5px 8px 5px 20px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      text-align: center;
    }

    .search-btn {
      background: #38bdf8;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* --- کارت‌های اطلاعاتی --- */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      width: 100%;
    }

    .info-card {
      background: rgba(18, 22, 31, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .info-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      min-height: 20px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- کره زمین و آسمان ۳ بعدی -->
  <div id="globeViz"></div>

  <!-- ۴ دکمه بالا سمت راست -->
  <div class="top-right-bar">
    <a href="https://lightning.engineering" target="_blank" class="btn-lightning" title="Lightning Engineering">
      <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </a>
    <a href="https://mempool.space" target="_blank" class="btn-mempool" title="Mempool.space">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H7v-4h4v4zm0-6H7V7h4v4zm6 6h-4v-4h4v4zm0-6h-4V7h4v4z"/></svg>
    </a>
    <a href="https://1ml.com" target="_blank" class="btn-1ml" title="1ML">1ML</a>
    <a href="https://amboss.space" target="_blank" class="btn-amboss" title="Amboss Space">Amboss</a>
  </div>

  <div class="app-container">
    <!-- آمار بالای صفحه -->
    <div class="top-stats interactive-element">
      <div class="stat-card"><div class="stat-value" id="stat1">-</div></div>
      <div class="stat-card"><div class="stat-value" id="stat2">-</div></div>
      <div class="stat-card"><div class="stat-value" id="stat3">-</div></div>
      <div class="stat-card"><div class="stat-value" id="stat4">-</div></div>
      <div class="stat-card"><div class="stat-value" id="stat5">-</div></div>
    </div>

    <!-- نوار سرچ -->
    <div class="search-wrapper interactive-element">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Enter ID..." onkeypress="handleKeyPress(event)">
        <button class="search-btn" onclick="executeSearch()">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <!-- گرید کارت‌های اطلاعات -->
    <div class="info-grid interactive-element">
      <div class="info-card">
        <div class="info-title">ON/OFF</div>
        <div class="info-value" id="val-onoff">-</div>
      </div>
      <!-- کارت WALLET ADDRESS همیشه خالی می‌ماند -->
      <div class="info-card">
        <div class="info-title">WALLET ADDRESS</div>
        <div class="info-value" id="val-wallet"></div>
      </div>
      <div class="info-card">
        <div class="info-title">STATUS TX</div>
        <div class="info-value" id="val-status">-</div>
      </div>

      <div class="info-card">
        <div class="info-title">COIN</div>
        <div class="info-value" id="val-coin">-</div>
      </div>
      <div class="info-card">
        <div class="info-title">FEE</div>
        <div class="info-value" id="val-fee">-</div>
      </div>
      <div class="info-card">
        <div class="info-title">ACTIVE CHANNEL</div>
        <div class="info-value" id="val-active-channel">-</div>
      </div>

      <div class="info-card">
        <div class="info-title">IP ADDRESS</div>
        <div class="info-value" id="val-ip">-</div>
      </div>
      <div class="info-card">
        <div class="info-title">MODE</div>
        <div class="info-value" id="val-mode">-</div>
      </div>
      <div class="info-card">
        <div class="info-title">CHANNEL TYPE</div>
        <div class="info-value" id="val-channel-type">-</div>
      </div>
    </div>
  </div>

  <script>
    // ۱. راه‌اندازی پس‌زمینه کره زمین سه‌بعدی و آسمان شب
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#38bdf8')
      .atmosphereAltitude(0.2);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // ۲. مدیریت کلیک سرچ و نمایش اطلاعات
    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    }

    function executeSearch() {
      const inputVal = document.getElementById('searchInput').value.trim();
      if (!inputVal) return;

      // اعداد آمار بالا
      document.getElementById('stat1').innerText = "012";
      document.getElementById('stat2').innerText = "19,927";
      document.getElementById('stat3').innerText = "2,632.4 BTC";
      document.getElementById('stat4').innerText = "12";
      document.getElementById('stat5').innerText = "28";

      // داده‌های کارت‌ها
      document.getElementById('val-onoff').innerText = "Online";
      
      // آدرس ولت طبق درخواست شما پس از سرچ هم خالی نگه داشته می‌شود
      document.getElementById('val-wallet').innerText = ""; 

      document.getElementById('val-status').innerText = "Pending ⓘ";
      document.getElementById('val-coin').innerText = "SOL";
      document.getElementById('val-fee').innerText = "15 SAT/VB";
      document.getElementById('val-active-channel').innerText = "Must Be Update Client";
      document.getElementById('val-ip').innerText = "🇹🇯 5.117.240.152";
      document.getElementById('val-mode').innerText = "CPU";
      
      // محدودیت حداکثر ۶ کانال
      document.getElementById('val-channel-type').innerText = "6 Channel";
    }
  </script>

</body>
</html>
