<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDHUB - Lightning Node Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0d17;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Header Navigation */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 50px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .lightning-icon {
            color: #2979ff;
            font-size: 26px;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            background-color: #1a233a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-link-badge {
            background-color: #1a233a;
            color: #2979ff;
            font-weight: bold;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
        }

        .nav-link-text {
            color: #aaa;
            font-size: 14px;
            text-decoration: none;
            margin-left: 5px;
        }

        /* Main Hero Section */
        .hero-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Stats Cards Layout */
        .stats-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: #1e2942;
            border: 1px solid #2a3a5e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            flex: 1;
            min-width: 160px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .stat-card.large {
            flex: 1.5;
        }

        .stat-label {
            font-size: 13px;
            color: #a0aec0;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-card.large .stat-value {
            color: #64b5f6;
        }

        /* Search Bar */
        .search-container {
            width: 100%;
            max-width: 550px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 24px;
            padding-right: 60px;
            background-color: #1e2942;
            border: 1px solid #2a3a5e;
            border-radius: 30px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            background-color: #4fc3f7;
            border: none;
            border-radius: 50%;
            color: #0b0d17;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand-logo">
            <span class="lightning-icon">⚡</span>
            <span>LND WORLD</span>
        </div>

        <div class="nav-icons">
            <div class="nav-btn">⚡</div>
            <div class="nav-btn">📊</div>
            <a href="#" class="nav-link-badge">1ML</a>
            <a href="#" class="nav-link-text">Amboss</a>
        </div>
    </div>

    <!-- Main Title -->
    <h1 class="hero-title">LND WORLD</h1>

    <!-- Dashboard Cards -->
    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-label">Total Nodes</div>
            <div class="stat-value">6,013</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Active Channels</div>
            <div class="stat-value">19,920</div>
        </div>

        <div class="stat-card large">
            <div class="stat-label">Network Capacity</div>
            <div class="stat-value">2,630.34 BTC</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">New Nodes</div>
            <div class="stat-value">11</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">New Channels</div>
            <div class="stat-value">274</div>
        </div>
    </div>

    <!-- Search Input -->
    <div class="search-container">
        <input type="text" class="search-input" placeholder="Search Node ...">
        <button class="search-btn">🔍</button>
    </div>

</body>
</html>
