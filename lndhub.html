<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDHUB - Lightning Node Manager</title>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #globe-container:active {
            cursor: grabbing;
        }

        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }

        .lightning-icon {
            color: #3b82f6;
            font-size: 22px;
            filter: drop-shadow(0 0 10px #2563eb);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .nav-link-badge {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
        }

        .hero-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(37, 99, 235, 0.6);
            text-align: center;
        }

        .stats-container {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(59, 130, 246, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 16px 14px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .stat-card.large {
            flex: 1.4;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-card.large .stat-value {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .search-container {
            width: 100%;
            max-width: 540px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 24px;
            padding-right: 60px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border: none;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        .footer {
            margin-top: auto;
            padding: 15px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="globe-container"></div>

    <div class="content-layer">
        <div class="header interactive">
            <div class="brand-logo">
                <span class="lightning-icon">⚡</span>
                <span>LND WORLD</span>
            </div>
            <div class="nav-icons">
                <div class="nav-btn">⚡</div>
                <div class="nav-btn">🌐</div>
                <a href="#" class="nav-link-badge">1ML</a>
                <span style="color: #94a3b8; font-size: 14px;">Amboss</span>
            </div>
        </div>

        <h1 class="hero-title">LND WORLD</h1>

        <div class="stats-container interactive">
            <div class="stat-card">
                <div class="stat-label">Total Nodes</div>
                <div class="stat-value">6,013</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Channels</div>
                <div class="stat-value">19,920</div>
            </div>
            <div class="stat-card large">
                <div class="stat-label">Network Capacity</div>
                <div class="stat-value">2,630.34 BTC</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">New Nodes</div>
                <div class="stat-value">11</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">New Channels</div>
                <div class="stat-value">274</div>
            </div>
        </div>

        <div class="search-container interactive">
            <input type="text" class="search-input" placeholder="Search Node ...">
            <button class="search-btn">🔍</button>
        </div>

        <footer class="footer interactive">
            &copy; 2026 LNDHUB. All Rights Reserved.
        </footer>
    </div>

    <script>
        const container = document.getElementById('globe-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -40, 190);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;

        const radius = 70;
        const globeGroup = new THREE.Group();
        globeGroup.position.y = -35;
        scene.add(globeGroup);

        // Load World Map Texture to project Continent Points
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = '';
        loader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg', function (texture) {
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024;
            canvas.height = 512;
            ctx.drawImage(texture.image, 0, 0, 1024, 512);
            const imgData = ctx.getImageData(0, 0, 1024, 512);

            const positions = [];
            const totalPoints = 25000;

            for (let i = 0; i < totalPoints; i++) {
                const phi = Math.acos(-1 + (2 * i) / totalPoints);
                const theta = Math.sqrt(totalPoints * Math.PI) * phi;

                // Map 3D sphere coordinates to 2D image coordinates
                const u = (theta / (2 * Math.PI)) % 1;
                const v = phi / Math.PI;

                const xImg = Math.floor(u * 1024);
                const yImg = Math.floor(v * 512);
                const index = (yImg * 1024 + xImg) * 4;

                // Render points only on continents (brighter parts of texture)
                if (imgData.data[index] > 40) {
                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);
                    positions.push(x, y, z);
                }
            }

            const dotsGeometry = new THREE.BufferGeometry();
            dotsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            const dotsMaterial = new THREE.PointsMaterial({
                color: 0x90caf9,
                size: 1.1,
                transparent: true,
                opacity: 0.9
            });

            const dotsMesh = new THREE.Points(dotsGeometry, dotsMaterial);
            globeGroup.add(dotsMesh);
        });

        // Blue Outer Atmosphere Glow Ring
        const glowGeo = new THREE.RingGeometry(radius + 2, radius + 22, 64);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x1e88e5,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.35
        });
        const glowRing = new THREE.Mesh(glowGeo, glowMat);
        globeGroup.add(glowRing);

        // Shooting Star
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x64b5f6, transparent: true, opacity: 0.8 });
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
        const shootingStar = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(shootingStar);

        const starHeadGeo = new THREE.BufferGeometry();
        starHeadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3));
        const starHeadMat = new THREE.PointsMaterial({ color: 0xffffff, size: 6, transparent: true });
        const starHead = new THREE.Points(starHeadGeo, starHeadMat);
        scene.add(starHead);

        let progress = 0;
        function updateShootingStar() {
            progress += 0.01;
            if (progress > 1) progress = 0;

            const startX = -65, startY = 55, startZ = 20;
            const endX = 15, endY = -20, endZ = 50;

            const curX = startX + (endX - startX) * progress;
            const curY = startY + (endY - startY) * progress;
            const curZ = startZ + (endZ - startZ) * progress;

            const linePos = shootingStar.geometry.attributes.position.array;
            linePos[0] = curX - 18; linePos[1] = curY + 18; linePos[2] = curZ - 5;
            linePos[3] = curX;       linePos[4] = curY;       linePos[5] = curZ;
            shootingStar.geometry.attributes.position.needsUpdate = true;

            const headPos = starHead.geometry.attributes.position.array;
            headPos[0] = curX; headPos[1] = curY; headPos[2] = curZ;
            starHead.geometry.attributes.position.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);

            globeGroup.rotation.y += 0.0015;
            updateShootingStar();
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
