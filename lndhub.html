<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDHub - Lightning Network Wrapper</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background-color: #121318;
            border: 1px solid #1f222c;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 32px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #f7931a, #ffd166);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(247, 147, 26, 0.3);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .description {
            color: #8a8f9d;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #a0a5b5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #1a1c23;
            border: 1px solid #2a2d39;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #f7931a;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #f7931a;
            color: #000000;
            font-weight: 700;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .footer-info {
            margin-top: 24px;
            font-size: 11px;
            color: #585d6e;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="brand-logo">⚡</div>
        <div class="status-badge">
            <span class="status-dot"></span>
            Node Operational
        </div>
        
        <h1 class="title">LNDHub</h1>
        <p class="description">Connect your Lightning wallet using your node credentials</p>

        <form onsubmit="event.preventDefault();">
            <div class="input-group">
                <label>Node Address / URL</label>
                <input type="text" placeholder="https://lndhub.world" value="https://lndhub.world" readonly>
            </div>

            <div class="input-group">
                <label>Login / User</label>
                <input type="text" placeholder="Enter login credential">
            </div>

            <div class="input-group">
                <label>Password / Secret</label>
                <input type="password" placeholder="Enter password credential">
            </div>

            <button type="submit" class="btn-submit">CONNECT WALLET</button>
        </form>

        <div class="footer-info">
            LNDHub Protocol Specification &copy; 2026
        </div>
    </div>

</body>
</html>
