<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNDHUB - Lightning Node Manager</title>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 3D Canvas Background */
        #globe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #globe-container:active {
            cursor: grabbing;
        }

        /* Content Overlay */
        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 20px 0 20px;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }

        /* Header Navigation */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .lightning-icon {
            color: #3b82f6;
            font-size: 24px;
            filter: drop-shadow(0 0 10px #2563eb);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            background-color: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .nav-link-badge {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
        }

        .nav-link-text {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
        }

        /* Hero Title */
        .hero-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-shadow: 0 0 35px rgba(37, 99, 235, 0.7);
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats Cards Layout */
        .stats-container {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 16px 14px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(59, 130, 246, 0.15);
        }

        .stat-card.large {
            flex: 1.4;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .stat-card.large .stat-value {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* Search Input */
        .search-container {
            width: 100%;
            max-width: 540px;
            position: relative;
            margin-bottom: 40px;
        }

        .search-input {
            width: 100%;
            padding: 14px 24px;
            padding-right: 60px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border: none;
            border-radius: 50%;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        /* Footer Bottom Bar */
        .footer {
            margin-top: auto;
            padding: 16px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            width: 100%;
            background: rgba(3, 7, 18, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <!-- 3D Globe Canvas -->
    <div id="globe-container"></div>

    <!-- UI Overlay Layer -->
    <div class="content-layer">
        <!-- Header -->
        <div class="header interactive-element">
            <div class="brand-logo">
                <span class="lightning-icon">⚡</span>
                <span>LND WORLD</span>
            </div>

            <div class="nav-icons">
                <div class="nav-btn">⚡</div>
                <div class="nav-btn">🌐</div>
                <a href="#" class="nav-link-badge">1ML</a>
                <a href="#" class="nav-link-text">Amboss</a>
            </div>
        </div>

        <!-- Title -->
        <h1 class="hero-title">LND WORLD</h1>

        <!-- Stats Cards -->
        <div class="stats-container interactive-element">
            <div class="stat-card">
                <div class="stat-label">Total Nodes</div>
                <div class="stat-value">6,013</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">Active Channels</div>
                <div class="stat-value">19,920</div>
            </div>

            <div class="stat-card large">
                <div class="stat-label">Network Capacity</div>
                <div class="stat-value">2,630.34 BTC</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">New Nodes</div>
                <div class="stat-value">11</div>
            </div>

            <div class="stat-card">
                <div class="stat-label">New Channels</div>
                <div class="stat-value">274</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container interactive-element">
            <input type="text" class="search-input" placeholder="Search Node ...">
            <button class="search-btn">🔍</button>
        </div>

        <!-- Footer Copyright -->
        <footer class="footer interactive-element">
            &copy; 2026 LNDHUB. All Rights Reserved.
        </footer>
    </div>

    <!-- 3D Scene Script -->
    <script>
        const container = document.getElementById('globe-container');

        // Scene, Camera & Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -35, 195); // Shifted to display lower globe section

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Interactive Orbit Controls (Enables dragging with Hand Cursor)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;
        controls.rotateSpeed = 0.8;

        // 1. Dot-Matrix Globe Structure
        const radius = 68;
        const dotsCount = 5500;
        const dotPositions = new Float32Array(dotsCount * 3);

        for (let i = 0; i < dotsCount; i++) {
            const phi = Math.acos(-1 + (2 * i) / dotsCount);
            const theta = Math.sqrt(dotsCount * Math.PI) * phi;

            dotPositions[i * 3] = radius * Math.cos(theta) * Math.sin(phi);
            dotPositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
            dotPositions[i * 3 + 2] = radius * Math.cos(phi);
        }

        const dotsGeometry = new THREE.BufferGeometry();
        dotsGeometry.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));

        const dotsMaterial = new THREE.PointsMaterial({
            color: 0x93c5fd,
            size: 1.25,
            transparent: true,
            opacity: 0.85
        });

        const globe = new THREE.Points(dotsGeometry, dotsMaterial);
        globe.position.y = -25;
        scene.add(globe);

        // 2. Bright Blue Atmosphere Atmosphere Ring Glow
        const glowGeo = new THREE.RingGeometry(radius + 1, radius + 22, 64);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x2563eb,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.35
        });
        const glowRing = new THREE.Mesh(glowGeo, glowMat);
        glowRing.position.y = -25;
        scene.add(glowRing);

        // 3. Shooting Star & Glowing Light Trail
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x60a5fa,
            transparent: true,
            opacity: 0.8,
            linewidth: 2
        });

        const lineGeometry = new THREE.BufferGeometry();
        const linePoints = new Float32Array(6 * 3); // Trail segment
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePoints, 3));
        const shootingStar = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(shootingStar);

        // Glowing Star Head Point
        const starHeadGeo = new THREE.BufferGeometry();
        starHeadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3));
        const starHeadMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 4.5,
            transparent: true
        });
        const starHead = new THREE.Points(starHeadGeo, starHeadMat);
        scene.add(starHead);

        let progress = 0;

        function updateShootingStar() {
            progress += 0.012;
            if (progress > 1) progress = 0;

            const startX = -70, startY = 60, startZ = 20;
            const endX = 10, endY = -10, endZ = 60;

            const curX = startX + (endX - startX) * progress;
            const curY = startY + (endY - startY) * progress;
            const curZ = startZ + (endZ - startZ) * progress;

            // Tail coordinates
            const tailX = curX - 18;
            const tailY = curY + 18;
            const tailZ = curZ - 5;

            const linePos = shootingStar.geometry.attributes.position.array;
            linePos[0] = tailX; linePos[1] = tailY; linePos[2] = tailZ;
            linePos[3] = curX;  linePos[4] = curY;  linePos[5] = curZ;
            shootingStar.geometry.attributes.position.needsUpdate = true;

            const headPos = starHead.geometry.attributes.position.array;
            headPos[0] = curX; headPos[1] = curY; headPos[2] = curZ;
            starHead.geometry.attributes.position.needsUpdate = true;
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            globe.rotation.y += 0.0015;
            glowRing.rotation.z += 0.0005;

            updateShootingStar();
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
