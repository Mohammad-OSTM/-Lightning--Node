<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Node Web</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #323232; color: #ffffff; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: #2b2b2b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #444; }
        .tab-btn { background: #444; color: #fff; border: none; padding: 10px 20px; cursor: pointer; border-radius: 6px 6px 0 0; font-weight: bold; }
        .tab-btn.active { background: #449e48; color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; color: #ccc; }
        input[type="text"], select { padding: 10px; background: #505050; border: 1px solid #666; color: #fff; border-radius: 6px; outline: none; }
        
        .btn-submit { width: 100%; background-color: #449e48; color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px 0; transition: 0.2s; }
        .btn-submit.stop { background-color: #d9534f; color: #fff; }
        
        .channels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 15px 0; border: 1px solid #444; padding: 15px; border-radius: 8px; }
        .channels label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; }
        
        .terminal { background: #1a1a1a; color: #00ff66; height: 180px; padding: 12px; font-family: monospace; overflow-y: auto; border-radius: 6px; font-size: 13px; margin-top: 15px; border: 1px solid #333; }
        
        .status-days { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
        .day-box { width: 32px; height: 32px; background: #fff; border: 2px solid #000; border-radius: 4px; }
        .day-box.active { background: #449e48; }
        
        .error-msg { color: #ff5555; font-size: 14px; margin-top: 5px; min-height: 20px; text-align: center; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; color: #fff; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background: #383838; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('home')">صفحه اصلی (Home)</button>
        <button class="tab-btn" onclick="switchTab('report')">گزارش‌ها (Report)</button>
    </div>

    <!-- TAB HOME -->
    <div id="home" class="tab-content active">
        <div class="form-grid">
            <div class="form-group">
                <label>Mode</label>
                <select id="cmb_mode">
                    <option value="CPU">CPU</option>
                    <option value="GPU">GPU</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="cmb_status">
                    <option value="High">High</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="form-group">
                <label>Coin</label>
                <select id="cmb_coin">
                    <option value="BTC">BTC</option>
                    <option value="ETH">ETH</option>
                    <option value="LTC">LTC</option>
                    <option value="SOL">SOL</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label>Wallet Address</label>
            <input type="text" id="txt_address" placeholder="آدرس کیف پول خود را وارد کنید">
        </div>

        <fieldset class="channels">
            <legend style="padding: 0 5px; color: #aaa;">Open Channel</legend>
            <label><input type="checkbox" class="chk-channel"> BTC Pay Server</label>
            <label><input type="checkbox" class="chk-channel"> Open Node</label>
            <label><input type="checkbox" class="chk-channel"> Wallet of Satoshi</label>
            <label><input type="checkbox" class="chk-channel"> Acinq.1ML.com</label>
            <label><input type="checkbox" class="chk-channel"> Tippin.Me</label>
            <label><input type="checkbox" class="chk-channel"> WX Network</label>
        </fieldset>

        <button id="btn_submit" class="btn-submit" onclick="toggleService()">START</button>
        <div id="lbl_error" class="error-msg"></div>

        <div style="margin-top: 15px;">
            <p>وضعیت آنلاین بودن: <strong id="online_days_text">0 / 9 day</strong></p>
            <div class="status-days" id="days_container">
                <div class="day-box"></div><div class="day-box"></div><div class="day-box"></div>
                <div class="day-box"></div><div class="day-box"></div><div class="day-box"></div>
                <div class="day-box"></div><div class="day-box"></div><div class="day-box"></div>
            </div>
        </div>

        <div class="terminal" id="terminal">>>>> Service Stopped<br></div>
    </div>

    <!-- TAB REPORT -->
    <div id="report" class="tab-content">
        <button class="btn-submit" style="width: auto; padding: 10px 20px;" onclick="fetchReports()">بررسی (Check)</button>
        <table id="tbl_reports">
            <thead>
                <tr>
                    <th>تاریخ</th>
                    <th>نوع</th>
                    <th>مقدار</th>
                    <th>وضعیت</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="4">اطلاعاتی یافت نشد</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let isStarted = false;
    let timer = null;

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    function toggleService() {
        const btn = document.getElementById('btn_submit');
        const err = document.getElementById('lbl_error');
        const address = document.getElementById('txt_address').value.trim();

        if (!isStarted) {
            if (address.length < 11) {
                err.innerText = 'لطفاً آدرس کیف پول معتبر وارد کنید';
                return;
            }

            const isChecked = Array.from(document.querySelectorAll('.chk-channel')).some(c => c.checked);
            if (!isChecked) {
                err.innerText = 'لطفاً حداقل یکی از کانال‌ها را انتخاب کنید';
                return;
            }

            err.innerText = '';
            isStarted = true;
            btn.innerText = 'STOP';
            btn.classList.add('stop');
            appendLog('>>>> Service Started');
            
            // شبیه‌سازی شروع فعالیت نود
            timer = setInterval(simulateNodeWork, 4000);
        } else {
            isStarted = false;
            btn.innerText = 'START';
            btn.classList.remove('stop');
            clearInterval(timer);
            appendLog('>>>> Service Stopped');
        }
    }

    function appendLog(msg) {
        const term = document.getElementById('terminal');
        term.innerHTML += `${msg}<br>`;
        term.scrollTop = term.scrollHeight;
    }

    function simulateNodeWork() {
        if (!isStarted) return;
        const randomHash = Math.random().toString(36).substring(2, 12);
        appendLog(`>>> UpdateTip: new best=${randomHash}`);
        
        // به‌روزرسانی تصادفی باکس‌های آنلاین
        const days = Math.floor(Math.random() * 9) + 1;
        document.getElementById('online_days_text').innerText = `${days} / 9 day`;
        const boxes = document.querySelectorAll('.day-box');
        boxes.forEach((box, i) => {
            if (i < days) box.classList.add('active');
            else box.classList.remove('active');
        });
    }

    function fetchReports() {
        const tbody = document.getElementById('tbl_reports').querySelector('tbody');
        tbody.innerHTML = `
            <tr><td>2026-03-30</td><td>Deposit</td><td>0.005 BTC</td><td>Completed</td></tr>
            <tr><td>2026-03-31</td><td>Reward</td><td>0.0001 BTC</td><td>Pending</td></tr>
        `;
    }
</script>

</body>
</html>
