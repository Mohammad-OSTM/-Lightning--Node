<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LND WORLD - Lightning Node</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b132b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .header-title { font-size: 36px; font-weight: 900; letter-spacing: 2px; margin-bottom: 20px; text-align: center; }
        .header-stats { display: flex; gap: 15px; width: 100%; max-width: 1000px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #4cc9f0; margin-top: 5px; }
        .stat-label { font-size: 13px; color: #a0aab8; }

        .start-btn { padding: 12px 35px; border-radius: 25px; border: none; background: #3a86ff; color: white; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 30px; transition: background 0.3s; }
        .start-btn:hover { background: #2563eb; }

        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 1000px; }
        
        /* انیمیشن برای ظهور هم‌زمان پس از تأخیر */
        .card { background: #1c2541; border-radius: 8px; padding: 20px; text-align: center; border: 1px solid #2a385b; opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .card.show { opacity: 1; transform: translateY(0); }
        
        .card-title { font-size: 13px; font-weight: bold; color: #8d99ae; margin-bottom: 10px; text-transform: uppercase; }
        .card-value { font-size: 16px; font-weight: bold; color: #4cc9f0; word-break: break-all; }
        .card-value.status { color: #06d6a0; }
    </style>
</head>
<body>

    <div class="header-title">LND WORLD</div>

    <div class="header-stats">
        <div class="stat-box"><div class="stat-label">Active Channels</div><div class="stat-value">19,927</div></div>
        <div class="stat-box"><div class="stat-label">Network Capacity</div><div class="stat-value">2,632.4 BTC</div></div>
        <div class="stat-box"><div class="stat-label">New Nodes</div><div class="stat-value">12</div></div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startValidation()">START VALIDATOR</button>

    <div class="grid-container" id="results-grid">
        <div class="card"><div class="card-title">ON/OFF</div><div class="card-value status">Online</div></div>
        <div class="card"><div class="card-title">WALLET ADDRESS</div><div class="card-value">GyUkZPmeTCiYPgTJHL1AEiHsfee9934zpA3wfL2fkbYQ</div></div>
        <div class="card"><div class="card-title">STATUS TX</div><div class="card-value">Pending ⓘ</div></div>
        <div class="card"><div class="card-title">COIN</div><div class="card-value">SOL</div></div>
        <div class="card"><div class="card-title">FEE</div><div class="card-value">15 SAT/VB</div></div>
        <div class="card"><div class="card-title">ACTIVE CHANNEL</div><div class="card-value">Must Be Update Client</div></div>
        <div class="card"><div class="card-title">IP ADDRESS</div><div class="card-value">🇮🇷 5.117.240.152</div></div>
        <div class="card"><div class="card-title">MODE</div><div class="card-value">CPU</div></div>
        <div class="card"><div class="card-title">CHANNEL TYPE</div><div class="card-value">6 Channel</div></div>
    </div>

    <script>
        function startValidation() {
            let cards = document.querySelectorAll('.card');
            
            // مخفی کردن کارت‌ها در صورتی که قبلاً روشن بوده باشند
            cards.forEach(card => card.classList.remove('show'));

            // تأخیر ۲ ثانیه‌ای و سپس نمایش هم‌زمان تمامی ولیدیتورها
            setTimeout(() => {
                cards.forEach(card => {
                    card.classList.add('show');
                });
            }, 2000); // زمان تأخیر به میلی‌ثانیه (۲۰۰۰ = ۲ ثانیه)
        }
    </script>
</body>
</html>
